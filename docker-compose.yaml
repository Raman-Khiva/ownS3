
services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ownS3
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ownS3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgres/data

  api:
    build:
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: "postgres://ownS3:password@postgres:5432/ownS3?sslmode=disable"
    volumes:
      - ./:/app

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8080:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro

volumes:
  postgres_data:
