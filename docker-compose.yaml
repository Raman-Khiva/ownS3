
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ownS3
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ownS3
    volumes:
      - postgres_data:/var/lib/postgres/data

  api:
    build:
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ./:/app


volumes:
  postgres_data:
